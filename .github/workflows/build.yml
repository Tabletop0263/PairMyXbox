name: build
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: padbridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -S --needed --noconfirm libogc
      - run: make -C wii boot.dol
      - run: mkdir -p out/apps/netpad && cp wii/boot.dol wii/meta.xml out/apps/netpad/
      - uses: actions/upload-artifact@v4
        with: { name: netpad-wii, path: out }
